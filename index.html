<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كلمات يومية مطورة</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="login-modal" class="modal">
<div class="modal-content">
<h2>تسجيل الدخول</h2>
<input type="text" id="username" placeholder="اسم المستخدم" required>
<input type="password" id="password" placeholder="كلمة المرور" required>
<button onclick="checkLogin()">دخول</button>
<button onclick="register()">تسجيل جديد</button>
<p id="error-msg" class="error"></p>
</div>
</div>
<div id="main-content" style="display: none;">
<main class="page-shell">
<section>
<ol class="word-list"></ol>
<p id="empty-state" class="empty-state hidden">لا يوجد نتائج</p>
<p>عدد الكلمات: <span id="word-count"></span></p>
</section>
<section>
<div id="quiz-panel" style="margin-top: 20px;">
<h3>لوحة التدريب</h3>
<button id="training-btn" class="nav-button" onclick="startQuiz()">ابدأ التدريب للكلمات</button>
<p id="question-text"></p>
<input type="text" id="user-answer" placeholder="اكتب الترجمة">
<button onclick="checkAnswer()">تحقق</button>
<p id="result-message"></p>
</div>
</section>
</main>
</div>
<script src="app.js"></script>
</body>
</html>
